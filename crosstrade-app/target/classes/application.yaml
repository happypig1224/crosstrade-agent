server:
  port: 8088
spring:
  application:
    name: crosstrade-agent

 # dashscope配置
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-3.6
          temperature: 0.7
          top-p: 0.9
          max-tokens: 1024
      embedding:
        options:
          model: text-embedding-v3
  # mysql配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/crosstrade_agent?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

  # redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456

# rocketmq配置
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: crosstrade-agent-producer
  consumer:
    group: crosstrade-agent-consumer

logging:
  level:
    com.alibaba.cloud.ai.dashscope.chat : debug
