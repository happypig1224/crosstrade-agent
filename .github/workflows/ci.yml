name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Build & Verify (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Test-Compile (Maven)
        run: mvn clean test-compile --no-transfer-progress

      - name: Package Backend Application
        run: mvn package -DskipTests --no-transfer-progress

      - name: Archive Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosstrade-app-jar
          path: crosstrade-app/target/*.jar
          retention-days: 7

  frontend-ci:
    name: Frontend Quality Gate (Vue 3 + TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crosstrade-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: crosstrade-web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (vue-tsc)
        run: npm run typecheck

      - name: Run Test Suite (Vitest)
        run: npm run test:run

      - name: Build Frontend Distribution
        run: npm run build

      - name: Archive Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosstrade-web-dist
          path: crosstrade-web/dist
          retention-days: 7
